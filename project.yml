name: LimbLog
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  LimbLog:
    type: application
    platform: iOS
    sources:
      - path: LimbLog
      - path: Shared
    dependencies:
      - target: LimbLogWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.limb-log
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: LimbLog/LimbLog.entitlements
    info:
      path: LimbLog/Info.plist
      properties:
        CFBundleDisplayName: Limb Log
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
  LimbLogWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: LimbLogWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.limb-log.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: LimbLogWidget/LimbLogWidget.entitlements
        SKIP_INSTALL: YES
    info:
      path: LimbLogWidget/Info.plist
      properties:
        CFBundleDisplayName: Limb Log Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  LimbLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LimbLogTests
    dependencies:
      - target: LimbLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.limb-log.tests
        GENERATE_INFOPLIST_FILE: YES
  LimbLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LimbLogUITests
    dependencies:
      - target: LimbLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.limb-log.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LimbLog
schemes:
  LimbLog:
    build:
      targets:
        LimbLog: all
        LimbLogTests: [test]
        LimbLogUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: LimbLog/StoreKit/Products.storekit
    test:
      config: Debug
      storeKitConfiguration: LimbLog/StoreKit/Products.storekit
      targets:
        - LimbLogTests
        - LimbLogUITests
    archive:
      config: Release
